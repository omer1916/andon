[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "andon"
version = "0.1.0"
description = "Fabrika verisi ve bakım kılavuzları üzerinde çalışan yapay zekâ asistanı"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.60",  # Gemini ve Ollama'nın OpenAI uyumlu API'si için
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2",
    "pypdf>=5",
    "sentence-transformers>=3",
    "tzdata",  # Windows'ta zoneinfo saat dilimi verisini bu paketten okur
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "faker>=30",
    "fpdf2>=2.8",  # sahte kılavuzların PDF'lerini üretmek için
    "httpx2",  # FastAPI TestClient için
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: temel hatalar, I: import sırası, B: sık yapılan hatalar, UP: modern Python yazımı
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # testler scripts/ altındaki modülleri de import edebilsin
