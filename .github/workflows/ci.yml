name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: andon
          POSTGRES_PASSWORD: andon
          POSTGRES_DB: andon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andon -d andon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://andon:andon@localhost:5432/andon_test
      # Veritabanına ulaşılamazsa testler atlanmasın, başarısız olsun.
      ANDON_DB_ZORUNLU: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          # PyPI'daki Linux torch paketi CUDA'lı (~2 GB). Testler modeli yüklemediği için
          # CPU sürümü yeterli.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (biçim)
        run: ruff format --check .

      - name: Testler
        run: pytest -v
