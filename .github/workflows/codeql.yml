name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Kod değişmese de yeni yayımlanan sorgularla haftada bir yeniden tara.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # actions: iş akışı dosyalarındaki enjeksiyon ve yetki hataları
        language: [python, javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
