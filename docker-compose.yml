services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-andon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andon}
      POSTGRES_DB: ${POSTGRES_DB:-andon}
    # "Geçen ay" gibi sorgular ay sınırını Türkiye saatine göre hesaplasın.
    command: ["postgres", "-c", "timezone=Europe/Istanbul"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
